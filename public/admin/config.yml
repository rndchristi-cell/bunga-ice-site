backend:
  name: github
  repo: rndchristi-cell/bunga-ice-site
  branch: main

media_folder: "public/images"
public_folder: "/images"

site_url: "https://bunga-ice-site.pages.dev"

collections:
  - name: "articles"
    label: "Artikel"
    folder: "src/content/articles"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - label: "Judul"
        name: "title"
        widget: "string"

      - label: "Slug"
        name: "slug"
        widget: "string"

      - label: "Tanggal"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false

      - label: "Kategori"
        name: "category"
        widget: "string"

      - label: "Excerpt"
        name: "excerpt"
        widget: "text"

      - label: "Gambar Utama"
        name: "image"
        widget: "image"
        required: false

      - label: "SEO Title"
        name: "seoTitle"
        widget: "string"
        required: false

      - label: "SEO Description"
        name: "seoDescription"
        widget: "text"
        required: false

      - label: "Isi Artikel"
        name: "body"
        widget: "markdown"

  - name: "services"
    label: "Layanan / Menu"
    folder: "src/content/services"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - label: "Nama"
        name: "title"
        widget: "string"

      - label: "Deskripsi"
        name: "description"
        widget: "text"

      - label: "Gambar"
        name: "image"
        widget: "image"
        required: false

      - label: "Urutan"
        name: "order"
        widget: "number"
        value_type: "int"
        default: 0

      - label: "Aktif"
        name: "active"
        widget: "boolean"
        default: true

      - label: "Link"
        name: "link"
        widget: "string"
        required: false

      - label: "Detail"
        name: "body"
        widget: "markdown"
        required: false

  - name: "gallery"
    label: "Gallery"
    folder: "src/content/gallery"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - label: "Judul"
        name: "title"
        widget: "string"

      - label: "Deskripsi"
        name: "description"
        widget: "text"
        required: false

      - label: "Gambar"
        name: "image"
        widget: "image"

      - label: "Urutan"
        name: "order"
        widget: "number"
        value_type: "int"
        default: 0

      - label: "Aktif"
        name: "active"
        widget: "boolean"
        default: true
